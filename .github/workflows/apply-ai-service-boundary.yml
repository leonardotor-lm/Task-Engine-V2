name: Apply AI service boundary refactor

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-ai-service-boundary.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'refactor/ai-service-boundary'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ai-service-boundary
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply migration
        run: node scripts/migrate-ai-service-boundary.mjs

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/Ai*Controller.js tests/AiServiceBoundary.test.js
          git commit -m "Aislar controladores de IA del repositorio de tareas"
          git push origin HEAD:refactor/ai-service-boundary
