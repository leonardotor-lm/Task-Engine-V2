name: Apply AI structured validation

on:
  push:
    branches:
      - fix/ai-structured-validation
    paths:
      - ".github/workflows/apply-ai-structured-validation.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-structured-validation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply validated migration
        run: |
          node scripts/migrate-ai-structured-validation.mjs
          node scripts/fix-ai-structured-validation-regressions.mjs

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-apps-script/AI.gs pwa-assets.js src/core/AiStructuredResponse.js src/ui/AiDueDateProposalController.js src/ui/AiOrganizationProposalController.js src/ui/AiProjectProposalController.js src/ui/AiTaskQualityController.js src/ui/AiWaitingProposalController.js tests/AiStructuredResponse.test.js
          git commit -m "Unificar validación estructurada de IA"
          git push origin HEAD:fix/ai-structured-validation
