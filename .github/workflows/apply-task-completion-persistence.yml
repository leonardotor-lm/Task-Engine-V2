name: Apply task completion persistence fix

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-task-completion-persistence.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/task-completion-persistence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/task-completion-persistence
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply migration
        run: node scripts/migrate-task-completion-persistence.mjs

      - name: Run unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/Task.js tests/TaskCompletionPersistence.test.js
          git commit -m "Preservar estado previo al completado al persistir"
          git push origin HEAD:fix/task-completion-persistence
