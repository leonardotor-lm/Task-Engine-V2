name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply task identity migration
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/ai-task-id-mapping'
        run: |
          python3 scripts/migrate-ai-task-ids.py
          rm scripts/migrate-ai-task-ids.py .github/workflows/ai-task-id-migration.yml
          cat > .github/workflows/test.yml <<'EOF'
          name: Tests

          on:
            pull_request:
            push:
              branches:
                - main

          jobs:
            test:
              runs-on: ubuntu-latest
              timeout-minutes: 15

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22

                - name: Install dependencies
                  run: npm install

                - name: Run unit tests
                  run: npm test

                - name: Install Chromium
                  run: npx playwright install --with-deps chromium

                - name: Run browser smoke tests
                  run: npm run test:e2e
          EOF

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Commit task identity migration
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/ai-task-id-mapping'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/AiTaskContext.js \
            src/ui/AiPriorityProposalController.js \
            src/ui/AiDueDateProposalController.js \
            src/ui/AiWaitingProposalController.js \
            src/ui/AiOrganizationProposalController.js \
            src/ui/AiProjectProposalController.js \
            src/ui/AiTaskQualityController.js \
            tests/AiTaskIdentityMapping.test.js \
            .github/workflows/test.yml
          git add -u scripts/migrate-ai-task-ids.py .github/workflows/ai-task-id-migration.yml
          git commit -m "Eliminar mapeo posicional de IDs en IA"
          git push origin HEAD:fix/ai-task-id-mapping
